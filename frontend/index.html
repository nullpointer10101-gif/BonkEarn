<!doctype html>
<html lang="en" style="background-color: #0d0b18; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0b18" />
    <meta name="color-scheme" content="dark" />
    <title>BonkEarn - Telegram Mini App</title>
    
    <!-- Instant Inline CSS & Telegram Dark UI Initialization -->
    <style>
      html, body {
        background-color: #0d0b18 !important;
        background: #0d0b18 !important;
        color: #f3f4f6;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        background-color: #0d0b18;
      }
      #root-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0%, #1e1238 0%, #0d0b18 70%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .loader-spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Telegram WebApp SDK (Fast loading) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Immediate Telegram WebApp Native Handshake
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.setHeaderColor('#0d0b18');
          window.Telegram.WebApp.setBackgroundColor('#0d0b18');
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      } catch (e) {}
    </script>

    <!-- Asynchronous Non-blocking Ad SDK -->
    <script async defer src="https://gigapub.b-cdn.net/gigapub-sdk.js"></script>

    <!-- Google Font Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #0d0b18;">
    <div id="root">
      <div id="root-loader">
        <div class="loader-spinner"></div>
        <div style="font-weight: 800; font-size: 18px; color: #fff; letter-spacing: 0.5px;">🐕 BONK EARN</div>
        <div style="font-size: 13px; color: #9ca3af; margin-top: 6px;">Opening Mini App...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
