<!doctype html>
<html lang="en" style="background-color: #0d0b18; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/bonk_coin.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0b18" />
    <meta name="color-scheme" content="dark" />
    <title>BonkEarn - Telegram Mini App</title>
    
    <!-- Instant Inline CSS & Telegram Dark UI Initialization -->
    <style>
      html, body {
        background-color: #0d0b18 !important;
        background: #0d0b18 !important;
        color: #f3f4f6;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        width: 100%;
        min-height: 100vh;
        background-color: #0d0b18;
      }
      #root-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 30%, #28144b 0%, #0d0b18 70%);
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .bonk-coin-splash {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        box-shadow: 0 0 30px rgba(245, 158, 11, 0.45), 0 0 60px rgba(139, 92, 246, 0.3);
        animation: bonkPulse 1.8s ease-in-out infinite alternate;
        margin-bottom: 20px;
        border: 2px solid rgba(251, 191, 36, 0.5);
      }
      .loader-spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(139, 92, 246, 0.25);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes bonkPulse {
        0% { transform: scale(0.96); filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.3)); }
        100% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.7)); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Telegram WebApp SDK (Fast loading) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Immediate Telegram WebApp Native Handshake
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.setHeaderColor('#0d0b18');
          window.Telegram.WebApp.setBackgroundColor('#0d0b18');
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      } catch (e) {}
    </script>

    <!-- GigaPub Telegram Ad SDK (Primary - App ID 7632) -->
    <script async defer src="https://ad.gigapub.tech/script?id=7632"></script>

    <!-- Monetag Telegram Mini App SDK (Backup / Failover - Zone 11527259) -->
    <script src="//libtl.com/sdk.js" data-zone="11527259" data-sdk="show_11527259"></script>

    <!-- Google Font Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body style="background-color: #0d0b18;">
    <div id="root">
      <div id="root-loader">
        <img src="/bonk_coin.png" alt="BONK Coin" class="bonk-coin-splash" />
        <div class="loader-spinner"></div>
        <div style="font-weight: 800; font-size: 20px; color: #fff; letter-spacing: 0.5px;">BONK EARN</div>
        <div style="font-size: 13px; color: #9ca3af; margin-top: 4px;">Opening Mini App...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
